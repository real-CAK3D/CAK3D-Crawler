name: Web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          CRAWLER_AI_PROVIDER: ${{ vars.CRAWLER_AI_PROVIDER }}
          CRAWLER_AI_BASE_URL: ${{ vars.CRAWLER_AI_BASE_URL }}
          CRAWLER_AI_MODEL: ${{ vars.CRAWLER_AI_MODEL }}
          CRAWLER_LOCK_PAID: ${{ vars.CRAWLER_LOCK_PAID }}
          CRAWLER_PLAY_URL: ${{ vars.CRAWLER_PLAY_URL }}
          CRAWLER_WEB_UPLOADS: 2
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
